<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aural Trainer — Tests</title>
  <style>
    body { font-family: monospace; background: #12141c; color: #eef0f6; padding: 24px; }
    .pass { color: #4caf7d; }
    .fail { color: #e5636b; }
    #summary { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>theory.js tests</h1>
  <ul id="results"></ul>
  <div id="summary"></div>

  <script type="module">
    import { results } from './theory.test.js';

    const list = document.getElementById('results');
    let passed = 0;

    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.pass ? 'pass' : 'fail';
      li.textContent = r.pass ? `PASS - ${r.name}` : `FAIL - ${r.name}: ${r.error}`;
      list.appendChild(li);
      if (r.pass) passed += 1;
    }

    const summary = document.getElementById('summary');
    summary.textContent = `${passed}/${results.length} passed`;
    summary.className = passed === results.length ? 'pass' : 'fail';
  </script>
</body>
</html>
